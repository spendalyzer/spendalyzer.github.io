<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spendalyzer - Smart Expense Tracker</title>
    <style>
        body {
            background: linear-gradient(135deg, #6750A4 0%, #BB86FC 100%);
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #222;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 480px;
            margin: 80px auto;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.12);
            padding: 40px 32px;
            text-align: center;
        }
        h1 {
            color: #6750A4;
            margin-bottom: 16px;
        }
        p {
            font-size: 1.2em;
            margin-bottom: 32px;
        }
        .cta {
            display: inline-block;
            padding: 12px 32px;
            background: #BB86FC;
            color: #fff;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.2s;
        }
        .cta:hover {
            background: #6750A4;
        }
        footer {
            margin-top: 40px;
            padding: 16px 0;
            background: #6750A4;
            color: #fff;
            text-align: center;
            font-size: 1em;
            border-radius: 0 0 16px 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to Spendalyzer</h1>
        <p>
            Track your expenses, analyze your spending, and achieve your financial goals with Spendalyzer.<br>
            Stay tuned for our launch!
        </p>
        <a href="#" class="cta">Notify Me</a>
    </div>
    <footer>
        &copy; 2025 Spendalyzer. All rights reserved.
    </footer>
</body>
</html>
